# Example only — create these out-of-band (kubectl create secret, External
# Secrets, SOPS, ...). Not referenced by kustomization.yaml on purpose.
apiVersion: v1
kind: Secret
metadata:
  name: roboflow-api-key
  namespace: immich-analyzer
stringData:
  ROBOFLOW_API_KEY: "<your Roboflow API key>"
---
apiVersion: v1
kind: Secret
metadata:
  name: immich-analyzer-api-keys
  namespace: immich-analyzer
stringData:
  # Comma-separated, one Immich API key per user to triage.
  IMMICH_API_KEYS: "<key-user-a>,<key-user-b>"
