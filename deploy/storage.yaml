apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inference-cache  # Roboflow model weights, downloaded once
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analyzer-state  # SQLite: embeddings, labels, sync flags, watermark
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
# Immich's upload directory (the one containing thumbs/), read-only. Bind it to
# a static PV for your NFS export / hostPath; storageClassName "" disables
# dynamic provisioning.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  resources:
    requests:
      storage: 1Ti
