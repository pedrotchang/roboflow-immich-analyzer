[project]
name = "roboflow-immich-analyzer"
version = "0.1.0"
description = "Triage an Immich library into Receipts / Screenshots / Safe to Delete albums with a self-hosted Roboflow Inference server (CLIP on GPU)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.1",
    "pillow>=11.0",
]

[project.scripts]
immich-analyzer = "immich_analyzer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/immich_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
